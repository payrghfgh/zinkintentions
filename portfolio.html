<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Zinkintentions</title>
    <meta name="description" content="Explore the portfolio of Zinkintentions. Browse through unique, handcrafted paintings available for purchase.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div id="navbar-placeholder"></div>

    <main class="section" style="padding-top: 8rem; min-height: 80vh;">
        <div class="container">
            <div class="text-center mb-4 reveal-up" style="transition-delay: 0.2s;">
                <h1 class="hero-title" style="font-size: 3rem;">Artwork Collection</h1>
                <p class="hero-subtitle">Handcrafted pieces available for purchase</p>
            </div>
            
            <!-- Artworks dynamically injected here -->
            <div class="artwork-grid" id="artwork-grid-container"></div>
        </div>
    </main>

    <!-- Artwork Details Modal -->
    <div class="modal-overlay" id="artwork-modal">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close" id="modal-close">&times;</button>
            <div class="modal-image-container">
                <img src="" alt="Artwork" class="modal-image" id="modal-img">
            </div>
            <div class="modal-details">
                <h2 class="modal-title" id="modal-title">Artwork Title</h2>
                <p class="modal-price" id="modal-price">Price</p>
                <p class="modal-desc">This is a unique handcrafted piece. Due to its authentic nature, slight variations in texture and color are part of its charm. Contact directly to arrange purchase and delivery.</p>
                
                <div style="display: flex; flex-direction: column; gap: 1rem; margin-top: 2rem;">
                    <a href="#" class="btn btn-primary text-center" id="modal-whatsapp-btn" target="_blank">Contact to Buy</a>
                    <a href="https://instagram.com/zinkintentions" class="btn btn-outline text-center" id="modal-insta-btn" target="_blank"><i class="fab fa-instagram"></i> View on Instagram</a>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/components.js"></script>
    <script type="module" src="js/script.js"></script>
    <script>
        loadNavbar('portfolio');
        loadFooter();
        loadWhatsAppWidget();
        loadAnnouncementBanner();
    </script>
</body>
</html>
